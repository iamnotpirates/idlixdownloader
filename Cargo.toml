[package]
name = "idlixdownloader"
version = "0.1.0-alpha"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
scraper = "0.22"
zip = "2.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
futures-util = "0.3"
regex = "1.11"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.11", features = ["v4"] }
tray-icon = "0.19"
open = "5.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
